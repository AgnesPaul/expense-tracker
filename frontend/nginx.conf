server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA routing: unknown paths return the shell, React handles the rest.
  # Phase 6 recreates this exact behaviour with CloudFront custom error responses.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker must never be cached, or users get stuck on an old one.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Caching, now that CloudFront sits in front. The rule is simple:
  #   - filenames that change when the content changes  -> cache forever
  #   - filenames that stay the same                    -> never cache
  #
  # Vite writes hashed names like index-CZfLaVKp.js, so a new build produces a
  # new filename and the old cached copy is simply never requested again. No
  # invalidation needed for assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html keeps its name across deploys, so it must always be revalidated.
  # Cache this and users keep loading an old page that points at assets which
  # no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # Single-origin API routing. CloudFront's second origin does this in Phase 6,
  # which is why the browser never encounters CORS.
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location /health { proxy_pass http://api:3000/health; }
}
