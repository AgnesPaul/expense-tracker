services:
  db:
    # Opt-in: only starts with `docker compose --profile localdb up`.
    # On EC2 the database is RDS, so this container isn't started at all.
    profiles: ["localdb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      # Bound to 127.0.0.1 so Postgres is reachable only from the machine
      # itself, never from the network. On your laptop you can still
      # `psql -h localhost`; on EC2 use `docker compose exec db psql`.
      # Defence in depth: this holds even if a security group is widened.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      # Defaults to the local container. On EC2 this is left unset and
      # db.env supplies PGHOST/PGUSER/PGPASSWORD/PGDATABASE instead.
      DATABASE_URL: ${DATABASE_URL-postgres://expense:expense@db:5432/expense}
      PGSSL: "${PGSSL:-false}"
      PORT: 3000
      # Phase 5. No AWS credentials here — the SDK gets temporary ones from
      # the instance's IAM role via the metadata service.
      # Connection details that are NOT secret — a hostname and a database
      # name reveal nothing on their own, and the database is unreachable
      # without credentials and the right security group anyway.
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-}
      # The part that IS secret. With this set, username and password are
      # fetched from Secrets Manager at boot using the instance's IAM role,
      # and no password exists on this machine at all.
      # Note an RDS-managed secret contains only username and password —
      # host/port/dbname must still come from the settings above.
      DB_SECRET_ID: ${DB_SECRET_ID:-}
      RECEIPTS_BUCKET: ${RECEIPTS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      # Phase 7: set this to "true" and restart to watch the ALB drain the target.
      FORCE_UNHEALTHY: "${FORCE_UNHEALTHY:-false}"
    # Read verbatim, with no ${} interpolation — which is exactly why a
    # generated password with $ or # in it is safe here but not in .env.
    env_file:
      - path: ./db.env
        required: false
    ports:
      # Localhost-only, same reasoning as the db service above. nginx reaches
      # the API as api:3000 over Docker's internal network and never uses this
      # published port; it exists so you can curl localhost:3000 on a laptop.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    # Migrations run on boot here for convenience. In Phase 4 you run them by
    # hand against RDS, which is why they live in a script and not in initdb.
    command: sh -c "node dist/migrate.js && node dist/index.js"

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
